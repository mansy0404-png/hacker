<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACKER</title>
  <meta name="description" content="HACKER — wear the signal. Underground techwear for the digitally inclined.">
  <meta name="theme-color" content="#070708">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f2592b'/%3E%3Cpath d='M19 17v30M45 17v30M19 32h26' stroke='%230b0b0d' stroke-width='7' stroke-linecap='square'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="split" aria-hidden="true">
    <div class="split__half split__half--orange"></div>
    <div class="split__half split__half--ink"></div>
  </div>

  <div class="frame">
    <header class="topbar">
      <a class="brand" href="#" aria-label="HACKER home">
        <span class="brand__word">HACKER</span>
        <span class="brand__mark" aria-hidden="true">↗</span>
      </a>
      <div class="topbar__actions">
        <button class="pill" type="button">SIGN IN</button>
        <button class="circle" type="button" aria-label="Language: English">EN</button>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu">MENU</button>
      </div>
    </header>

    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
      <nav class="mobile-menu__nav" aria-label="Mobile">
        <a class="mobile-menu__link is-active" href="#" aria-current="page">HOME</a>
        <a class="mobile-menu__link" href="#">ARSENAL</a>
        <a class="mobile-menu__link" href="#">WRITEUPS</a>
        <a class="mobile-menu__link" href="#">TOOLS</a>
        <a class="mobile-menu__link" href="#">LAB</a>
        <a class="mobile-menu__link" href="#">ABOUT</a>
      </nav>
      <div class="mobile-menu__foot">
        <span>R-18</span>
        <span>HACKER ↗</span>
      </div>
    </div>

    <main class="stage" id="main">
      <div class="stage__glow" aria-hidden="true"></div>

      <div class="ghosts" aria-hidden="true">
        <span class="ghost ghost--r">R</span>
        <span class="ghost ghost--e">E</span>
        <span class="ghost ghost--h">H</span>
      </div>

      <div class="sun-wrap" aria-hidden="true">
        <div class="sun"></div>
      </div>

      <div class="word-layer">
        <h1 class="hero-word" aria-label="HACKER">
          <span class="letter" style="--i:0" aria-hidden="true"><i>H</i></span>
          <span class="letter" style="--i:1" aria-hidden="true"><i>A</i></span>
          <span class="letter" style="--i:2" aria-hidden="true"><i>C</i></span>
          <span class="letter" style="--i:3" aria-hidden="true"><i>K</i></span>
          <span class="letter" style="--i:4" aria-hidden="true"><i>E</i></span>
          <span class="letter" style="--i:5" aria-hidden="true"><i>R</i></span>
        </h1>
      </div>

      <div class="character-layer" aria-hidden="true">
        <div class="character">
          <img class="char-art" src="img/character.png" alt="" decoding="async" draggable="false" />
        </div>
      </div>

      <div class="glitch-lines" aria-hidden="true">
        <span style="top:17%;left:7%;width:5%;background:#f2592b;opacity:.45"></span>
        <span style="top:23%;left:64%;width:9%;background:#37d0ba;opacity:.3"></span>
        <span style="top:31%;left:12%;width:3%;background:#f4f1ea;opacity:.35"></span>
        <span style="top:38%;left:84%;width:6%;background:#f2592b;opacity:.55"></span>
        <span style="top:44%;left:4%;width:8%;background:#7fd3ff;opacity:.28"></span>
        <span style="top:52%;left:88%;width:4%;background:#f4f1ea;opacity:.28"></span>
        <span style="top:59%;left:9%;width:10%;background:#37d0ba;opacity:.22"></span>
        <span style="top:66%;left:79%;width:7%;background:#f2592b;opacity:.4"></span>
        <span style="top:73%;left:16%;width:4%;background:#7fd3ff;opacity:.3"></span>
        <span style="top:81%;left:70%;width:8%;background:#f4f1ea;opacity:.18"></span>
        <span style="top:88%;left:34%;width:5%;background:#f2592b;opacity:.3"></span>
      </div>
      <div class="sweep" aria-hidden="true"></div>
      <div class="fx fx--noise" aria-hidden="true"></div>
      <div class="fx fx--scan" aria-hidden="true"></div>
      <div class="fx fx--vignette" aria-hidden="true"></div>
    </main>

    <aside class="side-nav" aria-label="Primary">
      <a class="side-nav__link is-active" href="#" aria-current="page">HOME</a>
      <a class="side-nav__link" href="#">ARSENAL</a>
      <a class="side-nav__link" href="#">WRITEUPS</a>
      <a class="side-nav__link" href="#">TOOLS</a>
      <a class="side-nav__link" href="#">LAB</a>
      <a class="side-nav__link" href="#">ABOUT</a>
    </aside>

    <p class="rating" aria-label="Rating 18 plus">R-18</p>

    <div class="dots" aria-hidden="true">
      <span class="dot dot--on"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="socials">
      <a class="social" href="https://www.instagram.com/0xd8b4d8bad988d981" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
          <circle cx="12" cy="12" r="4.2"/>
          <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
